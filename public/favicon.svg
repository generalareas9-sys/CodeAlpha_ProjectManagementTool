<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favicon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0F1020"/>
  <g transform="translate(10, 10)" filter="url(#fav-shadow)">
    <!-- Back card -->
    <rect x="2" y="2" width="32" height="38" rx="8" fill="url(#favicon-grad)" opacity="0.4" transform="rotate(-6 18 21)"/>
    <!-- Front card -->
    <rect x="7" y="4" width="34" height="38" rx="8" fill="url(#favicon-grad)"/>
    <!-- Checkmark -->
    <path d="M15 23L21 29L33 17" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
