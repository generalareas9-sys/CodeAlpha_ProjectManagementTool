<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <linearGradient id="taskora-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="taskora-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8B5CF6" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(6, 6)" filter="url(#taskora-glow)">
    <!-- Back Card -->
    <rect x="2" y="2" width="28" height="34" rx="8" fill="url(#taskora-grad)" opacity="0.35" transform="rotate(-6 16 19)"/>
    <!-- Front Card -->
    <rect x="8" y="5" width="30" height="34" rx="8" fill="url(#taskora-grad)"/>
    <!-- Checkmark & Task lines -->
    <path d="M15 22L20 27L31 16" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="12" r="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="21" y="11" width="12" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Wordmark -->
  <text x="58" y="37" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5px" fill="currentColor">
    Taskora
  </text>
  <circle cx="218" cy="34" r="4" fill="url(#taskora-grad)"/>
</svg>
